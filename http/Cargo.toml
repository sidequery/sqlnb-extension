[package]
name = "sidequery-ui-http"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "sidequery_http"
crate-type = ["staticlib", "rlib"]

[dependencies]
axum = { version = "0.7", features = ["json", "query"] }
bytes = "1"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
http-body-util = "0.1"
libc = "0.2"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
tokio-util = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile = "3"
