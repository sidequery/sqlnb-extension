name: Community extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    name: DuckDB 2.0
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@8f59772b4ef9a13837b3e353db032b3aca300d04
    with:
      extension_name: sqlnb
      duckdb_version: v2.0.0
      duckdb_commit: d54cbbe3df17e8e5ce68312f483b4155836112aa
      ci_tools_version: 8f59772b4ef9a13837b3e353db032b3aca300d04
      extra_toolchains: rust
      # The server requires native sockets/filesystems. MinGW is not supported
      # by the Windows filesystem implementation; MSVC is tested instead.
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools
      opt_in_archs: osx_amd64
      reduced_ci_mode: disabled
      save_cache: false

  rust:
    name: Rust contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Install build cache
        run: bash scripts/configure-ci.sh
      - name: Test HTTP, MCP, history, and filesystem contracts
        run: .ci/tools/bin/mbx test --manifest-path http/Cargo.toml --locked -- --test-threads=1
